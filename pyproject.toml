[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trust-verifier"
version = "0.1.0"
description = "Identity and cryptographic foundations for inter-agent trust."
requires-python = ">=3.10"
dependencies = ["cryptography"]

[tool.pytest.ini_options]
testpaths = [
    "identity/tests",
    "authority",
    "verifier/tests",
    "audit/tests",
    "reputation/tests",
    "storage/tests",
]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"
